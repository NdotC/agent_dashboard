[project]
name = "agentdash-server"
version = "0.1.0"
description = "Dashboard für lokale KI-Agenten: Logs, LLM-Aufrufe und Kommunikation zwischen Agenten"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "opentelemetry-proto>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentdash_server*"]

[tool.setuptools.package-data]
agentdash_server = ["db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["agentdash_server/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[project.scripts]
agentdash-server = "agentdash_server.main:main"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ASYNC109"]
